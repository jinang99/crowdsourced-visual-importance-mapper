<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Guessing Game</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #game-image {
      width: 100%;
      max-width: 600px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: all 0.5s ease;
    }
    .full-height {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .game-card {
      width: 100%;
      max-width: 1000px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      background-color: #f8f9fa;
    }
    @media (max-width: 768px) {
      .row {
        flex-direction: column-reverse;
      }
    }
  </style>
</head>
<body>

<div class="container full-height">
  <div class="game-card">
    <div class="row">
      <!-- Left Column for Image -->
      <div class="col-md-8 mb-4 mb-md-0 text-center">
        <h5 id="image-name" class="mb-3"></h5>
        <img id="game-image" src="" alt="Random Image">
      </div>

      <!-- Right Column for Game Controls -->
      <div class="col-md-4 d-flex flex-column">
        <h4 class="mb-3 text-center">Your Guess</h4>
        <input type="text" id="guess-input" class="form-control mb-2" placeholder="Type your guess here">
        <button class="btn btn-success mb-3" id="submit-btn" onclick="submitGuess()">Submit</button>
        <select id="mode-toggle" class="form-control mb-3" onchange="getRandomImage()">
          <option value="blurred">Blurred Mode</option>
          <option value="pixelated">Pixelated Mode</option>
        </select>
        <h5 id="score-text" class="text-center mt-auto">Score: 0</h5>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS and jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
  let score = 0;
  let currentImage = null;
  let guessAttempts = 0;

  window.onload = () => {
    getRandomImage();
    document.getElementById('guess-input').addEventListener('input', toggleSubmitButton);
    toggleSubmitButton();
  };

  function toggleSubmitButton() {
    const input = document.getElementById('guess-input').value.trim();
    document.getElementById('submit-btn').disabled = input === '';
  }

  function getRandomImage() {
    const mode = document.getElementById('mode-toggle').value;
    fetch(`http://127.0.0.1:5000/random_image?mode=${mode}`)
      .then(response => response.json())
      .then(data => {
        currentImage = data;
        document.getElementById('image-name').innerText = "Image ID: " + data.image_name;
        document.getElementById('game-image').src = data.image_url;
        document.getElementById('guess-input').value = '';
        guessAttempts = 0;
        toggleSubmitButton();
      })
      .catch(error => showAlert('Error fetching image.'));
  }

  function submitGuess() {
    const userGuess = document.getElementById('guess-input').value.trim().toLowerCase();
    fetch('http://127.0.0.1:5000/check_answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image_name: currentImage.image_name,
        guess: userGuess,
        mode: currentImage.mode,
        blur_level: currentImage.blur_level,
        pixel_ratio: currentImage.pixel_ratio
      }),
    })
    .then(response => response.json())
    .then(data => {
      if (data.correct) {
        const points = Math.max(100 - guessAttempts * 20, 20);
        score += points;
        document.getElementById('score-text').innerText = `Score: ${score}`;
        showAlert(`✅ Correct! You earned ${points} points.`, 'success');
        getRandomImage();
      } else {
        guessAttempts += 1;
        if (currentImage.mode === 'blurred' && data.new_blurred_image_url) {
          document.getElementById('game-image').src = data.new_blurred_image_url;
          currentImage.blur_level = data.blur_level;
        } else if (currentImage.mode === 'pixelated' && data.new_pixelated_image_url) {
          document.getElementById('game-image').src = data.new_pixelated_image_url;
          currentImage.pixel_ratio = data.pixel_ratio;
        } else {
          showAlert("⚠️ No more image resolution available. Moving on.", 'warning');
          getRandomImage();
        }
      }
    })
    .catch(() => showAlert('Error checking guess.'));
  }

  function showAlert(message, type = 'danger') {
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    document.querySelector('.game-card').prepend(alert);
    setTimeout(() => alert.remove(), 3000);
  }
</script>

</body>
</html>
