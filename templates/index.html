<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Animal Image</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Additional custom styles */
        #random-image {
            max-width: 100%;
            max-height: 400px;
            margin: 20px;
        }
        .full-height {
            height: 100vh;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            height: 100%;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row full-height">
        <!-- Left Column (70%) -->
        <div class="col-md-8 d-flex flex-column align-items-start">
            <h3 id="image-name" class="mt-4 ml-4"></h3>
            <img id="random-image" class="img-fluid" src="" alt="">
        </div>

        <!-- Right Column (30%) -->
        <div class="col-md-4">
            <div class="button-container">
                <button class="btn btn-primary" onclick="getRandomImage()">Get Random Image</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    function getRandomImage() {
        fetch('http://127.0.0.1:5000/random_image')
            .then(response => response.json())
            .then(data => {
                document.getElementById('image-name').innerText = "Image: " + data.image_name;
                document.getElementById('random-image').src = "http://127.0.0.1:5000/data/" + data.image_actual_answer + "/" + data.image_name;
            })
            .catch(error => console.error('Error fetching image:', error));
    }
</script>

</body>
</html>
